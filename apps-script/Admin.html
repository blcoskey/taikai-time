<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shiai Admin</title>
<style>
  :root {
    --bg: #f3f2ee; --card: #ffffff; --ink: #1b1f2a; --muted: #676c77; --line: #dedbd3; --soft: #eeebe4;
    --accent: #24345e; --accent-ink: #fff; --red: #c8102e; --red-bg: #fbe5e8; --white-edge: #a9b0be; --white-bg: #eef0f4;
    --good: #2f7d4f; --good-bg: #e2f1e8; --warn: #9a4d00; --warn-bg: #fdefd6; --now: #f2b705; --done-bg: #e6e3dc; --bad: #b42318; --bad-bg: #fde4e1;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a; --card: #1c1f27; --ink: #eef0f5; --muted: #9aa0ad; --line: #2e323d; --soft: #252933;
      --accent: #8fa6e8; --accent-ink: #10131a; --red: #ff5a6e; --red-bg: #3a1c22; --white-edge: #d9dde6; --white-bg: #2a2e38;
      --good: #6fd19a; --good-bg: #1a3326; --warn: #f4b860; --warn-bg: #3a2a12; --now: #f2c84b; --done-bg: #171a20; --bad: #ff8a80; --bad-bg: #3a1d1b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a; --card: #1c1f27; --ink: #eef0f5; --muted: #9aa0ad; --line: #2e323d; --soft: #252933;
    --accent: #8fa6e8; --accent-ink: #10131a; --red: #ff5a6e; --red-bg: #3a1c22; --white-edge: #d9dde6; --white-bg: #2a2e38;
    --good: #6fd19a; --good-bg: #1a3326; --warn: #f4b860; --warn-bg: #3a2a12; --now: #f2c84b; --done-bg: #171a20; --bad: #ff8a80; --bad-bg: #3a1d1b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px 60px; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 12px 0 10px; border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 19px; margin: 0; flex: 1; min-width: 160px; }
  h1 small { font-weight: 600; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .sync { font-size: 12px; color: var(--muted); }
  .sync.err { color: var(--bad); font-weight: 700; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 7px 12px; font-weight: 650; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.good { background: var(--good); color: #fff; border-color: var(--good); }
  .btn.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-weight: 700; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tabs { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
  .tabs button { border: 0; background: transparent; color: var(--muted); font-weight: 700; padding: 7px 12px; border-radius: 8px; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 18px 2px 8px; }
  .muted { color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); }
  .alert { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-weight: 650; margin-top: 10px; }
  .alert.bad { background: var(--bad-bg); color: var(--bad); }

  /* Score tab */
  .score-grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; margin-top: 14px; align-items: start; }
  @media (max-width: 900px) { .score-grid { grid-template-columns: 1fr; } .list { max-height: 260px; } }
  .list { position: sticky; top: 150px; max-height: calc(100vh - 170px); overflow: auto; padding: 4px; }
  .li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 6px; align-items: center; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 9px; padding: 6px 8px; }
  .li:hover { background: var(--soft); }
  .li[aria-current="true"] { border-color: var(--accent); background: var(--card); }
  .li .no { font-weight: 800; }
  .li .nm { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li .nm b { color: var(--red); }
  .li.done { opacity: .6; }
  .li .res { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stagehd { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 800; padding: 10px 8px 4px; }
  .pill { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; text-transform: uppercase; white-space: nowrap; }
  .pill.now { background: var(--now); color: #1b1f2a; }
  .pill.lvl { background: var(--warn-bg); color: var(--warn); }
  .pill.done { background: var(--good-bg); color: var(--good); }

  .fhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .fhead .big { font-size: 22px; font-weight: 800; }
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 640px) { .sides { grid-template-columns: 1fr; } }
  .side { border-radius: 12px; padding: 12px; border: 2px solid; }
  .side.red { border-color: var(--red); background: var(--red-bg); }
  .side.white { border-color: var(--white-edge); background: var(--white-bg); }
  .side .who { font-weight: 800; font-size: 19px; overflow-wrap: anywhere; }
  .side .who.pending { font-style: italic; font-weight: 500; color: var(--muted); }
  .side .dj { font-size: 12px; color: var(--muted); }
  .side select { width: 100%; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-weight: 700; }
  .marks { display: flex; gap: 6px; min-height: 40px; margin: 10px 0; align-items: center; flex-wrap: wrap; }
  .mk { min-width: 36px; height: 36px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; background: var(--card); border: 1px solid var(--line); }
  .mk.hs { color: var(--warn); }
  .ipp { margin-left: auto; font-size: 32px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .key { height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-weight: 900; font-size: 19px; }
  .key:active { transform: translateY(1px); }
  .key.hs { color: var(--warn); }
  .side .row { margin-top: 8px; justify-content: space-between; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
  .toggle input { width: 18px; height: 18px; }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .actions .btn { padding: 10px 16px; font-size: 16px; }
  .status { margin-top: 12px; font-weight: 700; }
  .shinbox { display: grid; gap: 6px; margin-top: 12px; }
  .shin1, .shin2 { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 8px; align-items: center; }
  .shin2 { grid-template-columns: 90px minmax(0, 1fr) minmax(0, 1fr); }
  .shinpick { display: contents; }
  .shinbox label { font-size: 12px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
  .shinbox label:empty { display: none; }
  .shinbox select { width: 100%; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); }
  .bouts { margin-top: 12px; display: grid; gap: 4px; }
  .bt { display: grid; grid-template-columns: 90px minmax(0, 1fr) 70px minmax(0, 1fr) 70px; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); text-align: left; }
  .bt[aria-current="true"] { border: 2px solid var(--accent); }
  .bt .pos { font-weight: 800; font-size: 13px; }
  .bt .r { color: var(--red); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bt .w { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
  .bt .sc { text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tsum { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-top: 10px; }
  .tsum .t { font-weight: 800; font-size: 18px; }
  .tsum .t.r { color: var(--red); }
  .tsum .t.w { text-align: right; }
  .tsum .mid { text-align: center; font-size: 13px; color: var(--muted); }
  .tsum .mid b { display: block; font-size: 24px; color: var(--ink); }

  /* Tables */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 5px 6px; }
  td { padding: 6px; border-top: 1px solid var(--line); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.tied td { background: var(--warn-bg); }
  tr.q td:first-child { color: var(--good); font-weight: 800; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
  @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
  .phead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .phead b { font-size: 17px; }
  input.cell, select.cell { width: 100%; padding: 5px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); }
  textarea { width: 100%; min-height: 260px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .form { display: grid; grid-template-columns: 220px 160px minmax(0, 1fr); gap: 8px 12px; align-items: center; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 650; z-index: 50; max-width: calc(100% - 32px); }
  .login { max-width: 380px; margin: 12vh auto; }
  .login input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 17px; margin: 10px 0; }
  .demo { background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 650; padding: 8px 12px; border-radius: 10px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="demo" class="demo hidden">Demo: this runs on a copy of the sheet kept in your browser. Use Reset on the Settings tab to start again.</div>
  <div id="login" class="login card hidden">
    <h1>Shiai admin</h1>
    <p id="loginErr" class="alert bad">Could not open the sheet.</p>
    <button class="btn primary" type="button" onclick="location.reload()">Try again</button>
  </div>
  <div id="app" class="hidden">
    <header>
      <div class="top">
        <h1 id="title">Shiai</h1>
        <span id="sync" class="sync"></span>
        <button id="reload" class="btn" type="button">Refresh</button>
        <button id="theme" class="btn" type="button" aria-label="Switch light or dark">◐</button>
      </div>
      <div id="comps" class="chips"></div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="score" aria-selected="true">Score</button>
        <button role="tab" data-tab="pools">Pools</button>
        <button role="tab" data-tab="entries">Entries &amp; draw</button>
        <button role="tab" data-tab="shinpan">Shinpan</button>
        <button role="tab" data-tab="spirit">Fighting spirit</button>
        <button role="tab" data-tab="settings">Settings</button>
      </nav>
    </header>
    <main id="view"></main>
  </div>
</div>
<script>
'use strict';
/* ===================== SHIAI CORE (shared by Code.gs and the web page) =====================
   Pure functions only: no sheet or page access here, so the sheet and the web app always agree.
   Kendo scoring: M (men), K (kote), D (do), T (tsuki) and H (point from opponent's hansoku) are ippon.
   ∆ marks one hansoku against that fighter (shown, but scores nothing).
============================================================================================== */

var SHIAI_IPPON = ['M', 'K', 'D', 'T', 'H'];
var SHIAI_DECISIONS = ['Red wins by forfeit', 'White wins by forfeit', 'Both forfeit', 'Red wins by hantei', 'White wins by hantei'];
var SHIAI_DEFAULTS = { title: 'Shiai', type: 'individual', teamSize: 3, courts: 1, poolSize: 3, qualify: 2, winPts: 3, drawPts: 2, ipponPts: 1, showSpirit: false, hantei: false, enchoMin: 0, forfeitIppon: 2 };

function shiaiKey(s) { return String(s == null ? '' : s).trim().replace(/\s+/g, ' ').toLowerCase(); }
function shiaiClean(s) { return String(s == null ? '' : s).trim().replace(/\s+/g, ' '); }

function shiaiMark(v) {
  var s = String(v == null ? '' : v).trim().toUpperCase();
  if (!s) return '';
  if (s === '∆' || s === 'Δ' || s === '▲' || s === '△' || s === '^' || s === 'X') return '∆';
  return s.charAt(0);
}

// Pool round robin order. Red is listed first. Small pools use the usual fixed orders.
function shiaiRoundRobin(n) {
  if (n < 2) return [];
  if (n === 2) return [[1, 2]];
  if (n === 3) return [[1, 2], [2, 3], [3, 1]];
  if (n === 4) return [[1, 2], [3, 4], [1, 3], [2, 4], [1, 4], [2, 3]];
  var ids = []; for (var i = 1; i <= n; i++) ids.push(i);
  if (n % 2) ids.push(0);
  var m = ids.length, out = [];
  for (var r = 0; r < m - 1; r++) {
    for (var j = 0; j < m / 2; j++) {
      var a = ids[j], b = ids[m - 1 - j];
      if (a && b) out.push(r % 2 ? [b, a] : [a, b]);
    }
    ids.splice(1, 0, ids.pop());
  }
  return out;
}

function shiaiPoolLetters(n) {
  var out = [];
  for (var i = 0; i < n; i++) out.push(i < 26 ? String.fromCharCode(65 + i) : 'P' + (i + 1));
  return out;
}

// Put fighters without a pool into pools, keeping club mates apart where possible.
// Returns a new list; fighters that already have a pool keep it.
function shiaiAssignPools(fighters, poolSize) {
  var list = fighters.map(function (f) { return { name: f.name, dojo: f.dojo, grade: f.grade, pool: shiaiClean(f.pool).toUpperCase() }; });
  var open = list.filter(function (f) { return !f.pool; });
  if (!open.length) return list;
  var size = Math.max(2, Number(poolSize) || 3);
  var existing = {};
  list.forEach(function (f) { if (f.pool) existing[f.pool] = (existing[f.pool] || 0) + 1; });
  var nPools = Math.max(1, Math.ceil(open.length / size));
  var letters = shiaiPoolLetters(nPools + Object.keys(existing).length).filter(function (l) { return !existing[l]; }).slice(0, nPools);
  // Biggest clubs first, then deal round the pools in a snake so each club spreads out.
  var byDojo = {};
  open.forEach(function (f) { var k = shiaiKey(f.dojo) || '~' + f.name; (byDojo[k] = byDojo[k] || []).push(f); });
  var groups = Object.keys(byDojo).map(function (k) { return byDojo[k]; }).sort(function (a, b) { return b.length - a.length; });
  var order = [].concat.apply([], groups);
  var counts = letters.map(function () { return 0; });
  var cap = letters.map(function (_, i) { return Math.floor(open.length / nPools) + (i < open.length % nPools ? 1 : 0); });
  var clubIn = letters.map(function () { return {}; });
  order.forEach(function (f) {
    var k = shiaiKey(f.dojo);
    var best = -1;
    for (var i = 0; i < letters.length; i++) {
      if (counts[i] >= cap[i]) continue;
      if (best < 0) { best = i; continue; }
      var ci = k ? (clubIn[i][k] || 0) : 0, cb = k ? (clubIn[best][k] || 0) : 0;
      if (ci < cb || (ci === cb && counts[i] < counts[best])) best = i;
    }
    f.pool = letters[best]; counts[best]++;
    if (k) clubIn[best][k] = (clubIn[best][k] || 0) + 1;
  });
  return list;
}

// Standard seeded bracket order, e.g. 8 -> [1,8,4,5,2,7,3,6].
function shiaiSeedOrder(size) {
  var order = [1];
  while (order.length < size) {
    var n = order.length * 2, next = [];
    order.forEach(function (s) { next.push(s, n + 1 - s); });
    order = next;
  }
  return order;
}

function shiaiRoundName(entrants) {
  if (entrants === 2) return { stage: 'Final', code: 'FINAL' };
  if (entrants === 4) return { stage: 'Semi-final', code: 'SF' };
  if (entrants === 8) return { stage: 'Quarter-final', code: 'QF' };
  return { stage: 'Last ' + entrants, code: 'R' + entrants + '-' };
}

// Knockout from pool places. Pool winners are seeded and get any byes; fighters from the same pool
// are kept as far apart in the bracket as possible.
function shiaiBuildKnockout(poolSizes, qualify) {
  var pools = Object.keys(poolSizes).sort();
  var winners = [], others = [];
  pools.forEach(function (p) {
    for (var place = 1; place <= Math.min(qualify, poolSizes[p]); place++) {
      (place === 1 ? winners : others).push({ src: p + place, pool: p, place: place });
    }
  });
  others.sort(function (a, b) { return a.place - b.place || (a.pool < b.pool ? -1 : 1); });
  var q = winners.length + others.length;
  if (q < 2) return [];
  var size = 1; while (size < q) size *= 2;
  var seeds = shiaiSeedOrder(size);
  var slots = new Array(size).fill(null);
  var n = pools.length;
  // The SAKF layout: with 2 through from each of 2, 4, 8... pools, each pool winner meets the next
  // pool's runner-up (A1-B2, C1-D2 | B1-C2, D1-A2). A, C... winners take the top half, B, D... the bottom,
  // so fighters from the same pool can only meet in the final.
  var even = n >= 2 && (n & (n - 1)) === 0 && others.length === n && others.every(function (o) { return o.place === 2; });
  if (even) {
    var pairs = [[], []];
    pools.forEach(function (p, i) { pairs[i % 2].push(p + '1', pools[(i + 1) % n] + '2'); });
    slots = pairs[0].concat(pairs[1]).map(function (src) { return { src: src }; });
  } else winners.forEach(function (w, i) { slots[seeds.indexOf(i + 1)] = w; });
  var free = [];
  if (!even) seeds.forEach(function (s, i) { if (s > winners.length && s <= q) free.push(i); });
  var meet = function (a, b) { var x = a ^ b, r = 0; while (x) { r++; x >>= 1; } return r; };
  if (!even) others.forEach(function (o) {
    var mates = [];
    slots.forEach(function (s, i) { if (s && s.pool === o.pool) mates.push(i); });
    var best = null, bestScore = -1, bestSeed = Infinity;
    free.forEach(function (i) {
      var score = mates.length ? Math.min.apply(null, mates.map(function (m) { return meet(i, m); })) : 99;
      if (score > bestScore || (score === bestScore && seeds[i] < bestSeed)) { best = i; bestScore = score; bestSeed = seeds[i]; }
    });
    slots[best] = o; free.splice(free.indexOf(best), 1);
  });
  // Build rounds. Each entry is a source: 'A1' (pool place) or 'W:QF1' (winner of a fight).
  var fights = [];
  var current = slots.map(function (s) { return s ? s.src : null; });
  var entrants = size;
  while (current.length > 1) {
    var rn = shiaiRoundName(entrants), next = [], n = 0;
    for (var i = 0; i < current.length; i += 2) {
      var a = current[i], b = current[i + 1];
      if (a && b) {
        n++;
        var code = rn.code === 'FINAL' ? 'FINAL' : rn.code + n;
        fights.push({ code: code, stage: rn.stage, redFrom: a, whiteFrom: b, half: i < current.length / 2 ? 0 : 1 });
        next.push('W:' + code);
      } else next.push(a || b);
    }
    current = next; entrants /= 2;
  }
  return fights;
}

// The whole draw: pool fights, one pool at a time on each court, then the knockout.
function shiaiBuildDraw(fighters, settings) {
  var st = shiaiSettings(settings);
  var assigned = shiaiAssignPools(fighters.filter(function (f) { return shiaiClean(f.name); }), st.poolSize);
  var pools = {};
  assigned.forEach(function (f) { (pools[f.pool] = pools[f.pool] || []).push(f); });
  var letters = Object.keys(pools).sort();
  var courts = Math.max(1, st.courts);
  var rows = [];
  var perCourt = [];
  for (var c = 0; c < courts; c++) perCourt.push([]);
  // Spread pools over courts, biggest pools first, onto the court with the fewest fights.
  var load = perCourt.map(function () { return 0; });
  letters.slice().sort(function (a, b) { return pools[b].length - pools[a].length || (a < b ? -1 : 1); }).forEach(function (p) {
    var c = load.indexOf(Math.min.apply(null, load));
    perCourt[c].push(p);
    load[c] += shiaiRoundRobin(pools[p].length).length;
  });
  perCourt.forEach(function (ps, ci) {
    ps.sort();
    var lists = ps.map(function (p) {
      return shiaiRoundRobin(pools[p].length).map(function (pair, k) {

function shiaiOrdinal(n) { return n === 1 ? 'winner' : n === 2 ? '2nd' : n === 3 ? '3rd' : n + 'th'; }

// Ippon for each side. M, K, D, T score. A point from hansoku can be entered as H, or left to the

function shiaiPositions(n) {

    showSpirit: s.showSpirit === true || /^(y|yes|true|1)$/i.test(String(s.showSpirit || '').trim()),

/* raw = { settings, fighters:[{name,dojo,grade,pool}], fights:[{order,code,stage,court,red,rm[],wm[],white,decision,done,shinpan[],pool,redFrom,whiteFrom}], spirit:[name...] }

    return { name: shiaiClean(f.name), dojo: shiaiClean(f.dojo), grade: shiaiClean(f.grade), pool: shiaiClean(f.pool).toUpperCase(), members: (f.members || []).map(shiaiClean).filter(Boolean) };

      court: Math.max(1, Number(f.court) || 1), pool: shiaiClean(f.pool).toUpperCase(),
      playoff: /play.?off/i.test(stage) || /-PO\d*$/i.test(shiaiClean(f.code)),

    });

    });

// Time estimate formulas for the Competitions tab. tab = fights tab name, L = the competition's column

          ? el('button', { class: 'btn', onclick: () => patchRow(b.row, { done: false, hantei: '' }) }, 'Reopen bout')
          : el('button', { class: 'btn good', onclick: () => { patchRow(b.row, { done: true }); const nx = list.find(x => x.row > b.row && !x.done); if (nx) S.bout = nx.row; } }, 'Bout complete')));
  }
  const s = f.scores || { red: 0, white: 0 };
  return el('div', { class: 'card' },
    el('div', { class: 'fhead' }, el('span', { class: 'big' }, '#' + f.order), el('span', { class: 'muted' }, [f.code, f.stage, st.courts > 1 ? 'Court ' + f.court : ''].filter(Boolean).join(' · '))),
    shinpanPicker(f, head),
    el('div', { class: 'tsum' },
      el('div', { class: 't r' }, f.red.label),
      el('div', { class: 'mid' }, el('b', {}, s.red + ' – ' + s.white), 'points · bouts ' + f.wins.red + '–' + f.wins.white + ' · ippon ' + f.red.ippon + '–' + f.white.ippon),
      el('div', { class: 't w' }, f.white.label)),
    pending ? el('div', { class: 'alert' }, 'Waiting for ' + [f.red, f.white].filter(x => x.pending).map(x => x.label).join(' and ') + '.') : null,
    f.done ? el('div', { class: 'status' }, f.result === 'draw' ? 'Match drawn.' : (f.result === 'red' ? f.red.label : f.white.label) + ' win the match' + (f.forfeit ? ' by forfeit.' : '.')) : null,
    f.level ? el('div', { class: 'alert' }, 'Level on points. Fight the daihyosen.') : null,
    el('div', { class: 'bouts' }, boutRows),
    panel,
    el('div', { class: 'row', style: 'margin-top:14px' }, el('span', { class: 'note' }, 'Whole team forfeits:'),
      el('label', { class: 'toggle' }, el('input', { type: 'checkbox', checked: !!head._rF, onchange: e => patchRow(f.row, { rF: e.target.checked }) }), f.red.label),
      el('label', { class: 'toggle' }, el('input', { type: 'checkbox', checked: !!head._wF, onchange: e => patchRow(f.row, { wF: e.target.checked }) }), f.white.label)));
}

/* ----- Pools tab ----- */
async function addPlayoffs() {
  try { const out = JSON.parse(await run('adminPlayoffs')); setData(out.data); toast(out.added ? out.added + ' play-off ' + (out.added === 1 ? 'fight' : 'fights') + ' added after the pool.' : 'No play-offs needed right now.'); } catch (e) {}
}
function renderPools() {
  const st = computed();
  if (!st || !st.pools.length) return el('div', { class: 'card', style: 'margin-top:14px' }, 'No pools yet.');
  const team = st.type === 'team';
  return el('div', {},
    el('h2', {}, S.comp + ' pools'),
    el('p', { class: 'note' }, team ? 'Points are every bout added up: 3 per bout won, 2 per bout drawn, 1 per ippon.' : 'Points: 3 for a win, 2 for a draw, 1 per ippon scored. Forfeit wins count 2 ippon. Equal points at a place that matters means a play-off.'),
    el('div', { class: 'grid2' }, st.pools.map(p => el('div', { class: 'card' },
      el('div', { class: 'phead' }, el('b', {}, 'Pool ' + p.pool), el('span', { class: 'note' }, p.complete ? (p.playoffNeeded ? 'Finished: play-off needed' : 'Finished') : p.played + ' of ' + p.total + ' done')),
      el('table', {}, el('thead', {}, el('tr', {}, ['', team ? 'Team' : 'Fighter', 'Fought', 'W', 'D', 'L', 'Ippon', 'Points', ''].map((h, i) => el('th', { class: i > 1 && i < 8 ? 'n' : '' }, h)))),
        el('tbody', {}, p.rows.map(r => el('tr', { class: (r.tied ? 'tied' : '') + (r.qualified ? ' q' : '') },
          el('td', {}, p.played ? r.place : ''), el('td', {}, r.name, r.members && r.members.length ? el('div', { class: 'note' }, r.members.join(', ')) : null),
          [r.fought, r.w, r.d, r.l, r.ipp].map(v => el('td', { class: 'n' }, v)), el('td', { class: 'n' }, el('b', {}, r.points)),
          el('td', { class: 'note' }, r.tied ? 'Play-off' : r.qualified ? 'Through' : p.complete ? 'Out' : ''))))),
      p.playoffNeeded ? el('div', { class: 'alert' }, p.tiedNames.join(', ') + ' are level. ', el('button', { class: 'btn', onclick: addPlayoffs }, 'Add play-off fights')) : null))));
}

/* ----- Entries & draw tab ----- */
function renderEntries() {
  const names = S.data.comps.map(c => c.name);
  const all = S.data.entries.map(r => r.slice());
  const c = compDef();
  const team = c.settings.type === 'team';
  const mine = all.map((r, i) => ({ r, i })).filter(x => x.r[0] === S.comp);
  const others = all.filter(r => r[0] !== S.comp);
  const rows = mine.map(x => x.r);
  const body = el('tbody');
  const draw = () => {
    body.replaceChildren(...rows.map((r, k) => el('tr', {},
      el('td', {}, el('input', { class: 'cell', value: r[1], 'aria-label': 'Name', oninput: e => { r[1] = e.target.value; dirty(); } })),
      el('td', {}, el('input', { class: 'cell', value: r[2], 'aria-label': 'Dojo', oninput: e => { r[2] = e.target.value; dirty(); } })),
      el('td', {}, el('input', { class: 'cell', value: r[6], 'aria-label': 'Age', style: 'width:56px', oninput: e => { r[6] = e.target.value; dirty(); } })),
      team ? el('td', {}, el('input', { class: 'cell', value: r[5], 'aria-label': 'Team', oninput: e => { r[5] = e.target.value; dirty(); } })) : null,
      el('td', {}, el('input', { class: 'cell', value: r[4], 'aria-label': 'Pool', style: 'width:50px', oninput: e => { r[4] = e.target.value.toUpperCase(); dirty(); } })),
      el('td', {}, el('select', { class: 'cell', 'aria-label': 'Competition', onchange: e => { r[0] = e.target.value; r[4] = ''; dirty(); } }, names.map(n => el('option', Object.assign({ value: n }, n === r[0] ? { selected: true } : {}), n)))),
      el('td', {}, el('button', { class: 'btn danger', onclick: () => { rows.splice(k, 1); dirty(); draw(); } }, 'Remove')))));
  };
  draw();
  const save = async () => {
    const out = others.concat(rows).map(r => [r[0], r[1], r[2], r[3] || '', r[4] || '', r[5] || '', r[6] || '']);
    try { const res = await run('adminSaveEntries', out); document.getElementById('view').dataset.dirty = ''; setData(res); toast('Entries saved.'); } catch (e) {}
  };
  const makeDraw = async () => {
    const st = computed();
    const started = st.fights.some(f => f.done || f.red.marks.length || f.white.marks.length);
    if (!confirm(started ? S.comp + ' already has scores. A new draw replaces every ' + S.comp + ' fight and its scores. Continue?' : 'Make the ' + S.comp + ' draw now? Anyone without a pool gets one.')) return;
    try { if (document.getElementById('view').dataset.dirty === '1') await save(); const res = await run('adminDraw', S.comp); setData(res); toast(S.comp + ' draw made.'); } catch (e) {}
  };
  return el('div', {},
    el('h2', {}, S.comp + ' entries'),
    el('p', { class: 'note' }, team ? 'One row per fighter. Fighters with the same Team name make a team, fighting in the order listed. Set the number of bouts on the Settings tab.' : 'To move someone to another competition, change it here and redo both draws. Leave Pool blank and the draw sets it, keeping clubmates apart. Clear the pools to redraw from scratch.'),
    el('div', { class: 'card' }, el('table', {},
      el('thead', {}, el('tr', {}, ['Name', 'Dojo', 'Age', team ? 'Team' : null, 'Pool', 'Competition', ''].filter(x => x !== null).map(h => el('th', {}, h)))), body),
      el('div', { class: 'row', style: 'margin-top:10px' },
        el('button', { class: 'btn', onclick: () => { rows.push([S.comp, '', '', '', '', '', '']); dirty(); draw(); body.querySelector('tr:last-child input')?.focus(); } }, 'Add ' + (team ? 'fighter' : 'entry')),
        el('button', { class: 'btn', onclick: () => { rows.forEach(r => { r[4] = ''; }); dirty(); draw(); } }, 'Clear pools'),
        el('button', { class: 'btn primary', onclick: save }, 'Save entries'))),
    el('h2', {}, 'Draw'),
    el('div', { class: 'card row' }, el('span', { class: 'note', style: 'flex:1' }, 'Makes every ' + S.comp + ' fight from the saved entries, with shinpan filled in by the rotation.'), el('button', { class: 'btn primary', onclick: makeDraw }, 'Make ' + S.comp + ' draw')));
}

/* ----- Shinpan tab ----- */
function renderShinpan() {
  const ta = el('textarea', { 'aria-label': 'Shinpan in rotation order', oninput: dirty }); ta.value = S.data.shinpan.join('\n');
  return el('div', {},
    el('h2', {}, 'Shinpan rotation'),
    el('p', { class: 'note' }, 'One name per line, in rotation order. Three referee each match. Every 2 matches the longest-serving one steps out and the next on the list steps in, carrying on through the competitions in order. Change a single match on the Score tab.'),
    el('div', { class: 'card' }, ta,
      el('div', { class: 'row', style: 'margin-top:10px' },
        el('button', { class: 'btn primary', onclick: async () => { try { const r = await run('adminSaveShinpan', ta.value.split('\n')); document.getElementById('view').dataset.dirty = ''; setData(r); toast('Shinpan list saved.'); } catch (e) {} } }, 'Save list'),
        el('button', { class: 'btn', onclick: async () => { if (!confirm('Refill the shinpan for every match not yet finished, from the list as saved?')) return; try { setData(await run('adminRotate')); toast('Rotation redone from the next fight.'); } catch (e) {} } }, 'Redo rotation from the next fight'))));
}

/* ----- Fighting spirit tab ----- */
function renderSpirit() {
  const st = computed();
  const names = st.type === 'team' ? [].concat(...st.fighters.map(f => f.members)) : st.fighters.map(f => f.name);
  const mine = {}; S.data.spirit.filter(r => r[0] === S.comp).forEach(r => { mine[r[1]] = [r[2] || '', r[3] || '']; });
  const rows = S.data.shinpan.map(sp => [sp].concat(mine[sp] || ['', '']));
  const tally = () => { const t = {}; rows.forEach(r => [r[1], r[2]].forEach(v => { if (v) t[v] = (t[v] || 0) + 1; })); return Object.entries(t).sort((a, b) => b[1] - a[1]); };
  const tallyBox = el('div', { class: 'note' });
  const showTally = () => { const t = tally(); tallyBox.textContent = t.length ? 'Leading: ' + t.slice(0, 3).map(([n, v]) => n + ' (' + v + ')').join(', ') : 'No votes yet.'; };
  showTally();
  const pick = (r, k) => el('select', { class: 'cell', onchange: e => { r[k] = e.target.value; dirty(); showTally(); } }, [''].concat(names).map(n => el('option', Object.assign({ value: n }, n === r[k] ? { selected: true } : {}), n || '—')));
  return el('div', {},
    el('h2', {}, S.comp + ' fighting spirit'),
    el('p', { class: 'note' }, 'Each shinpan gives two votes. Most votes wins.'),
    el('div', { class: 'card' }, el('table', {}, el('thead', {}, el('tr', {}, ['Shinpan', 'Vote 1', 'Vote 2'].map(h => el('th', {}, h)))),
      el('tbody', {}, rows.map(r => el('tr', {}, el('td', {}, r[0]), el('td', {}, pick(r, 1)), el('td', {}, pick(r, 2)))))),
      el('div', { class: 'row', style: 'margin-top:10px' }, tallyBox, el('span', { style: 'flex:1' }),
        el('button', { class: 'btn primary', onclick: async () => { try { const r = await run('adminSaveSpirit', S.comp, rows.filter(x => x[1] || x[2])); document.getElementById('view').dataset.dirty = ''; setData(r); toast('Votes saved.'); } catch (e) {} } }, 'Save votes'))));
}

/* ----- Settings tab ----- */
const EDITABLE = [
  ['Bouts per team match', 'number', 'Team events. A daihyosen is added after these.', 'team'],
  ['Pool size', 'number', 'Used when the draw makes the pools.'],
  ['Qualify per pool', 'number', 'How many from each pool go through.'],
  ['Courts (shiaijo)', 'number', ''],
  ['Minutes per fight before semi-finals', 'number', 'For the time estimate.'],
  ['Minutes per fight from semi-finals', 'number', ''],
  ['Start time', 'text', 'Like 9:00.'],
  ['Encho minutes', 'number', 'Blank = until someone scores.'],
  ['Hantei after encho', 'yesno', 'Knockout and play-off fights.'],
  ['Show fighting spirit on web app', 'yesno', 'Shows the winner on the board.'],
];
function renderSettings() {
  const c = compDef();
  const team = c.settings.type === 'team';
  const vals = {};
  const form = el('div', { class: 'form' }, EDITABLE.filter(e => !e[3] || team).map(([label, type, help]) => {
    const cur = c.setting[label] == null ? '' : String(c.setting[label]);
    vals[label] = cur;
    const input = type === 'yesno'
      ? el('select', { class: 'cell', onchange: e => { vals[label] = e.target.value; dirty(); } }, ['No', 'Yes'].map(o => el('option', Object.assign({ value: o }, /^y/i.test(cur) === (o === 'Yes') ? { selected: true } : {}), o)))
      : el('input', { class: 'cell', type: type === 'number' ? 'number' : 'text', value: cur, oninput: e => { vals[label] = e.target.value; dirty(); } });
    return [el('label', {}, label), input, el('span', { class: 'note' }, help)];
  }));
  return el('div', {},
    el('h2', {}, S.comp + ' settings'),
    el('div', { class: 'card' }, form,
      el('div', { class: 'row', style: 'margin-top:12px' },
        el('button', { class: 'btn primary', onclick: async () => { try { const r = await run('adminSaveSettings', S.comp, vals); document.getElementById('view').dataset.dirty = ''; setData(r); toast('Settings saved. Redo the draw if you changed pools or team size.'); } catch (e) {} } }, 'Save settings'))),
    el('p', { class: 'note' }, 'Points (3 win, 2 draw, 1 per ippon) and the rest live on the Competitions tab of the sheet.'),
    typeof demoServer !== 'undefined' ? el('div', { class: 'card row', style: 'margin-top:12px' }, el('span', { class: 'note', style: 'flex:1' }, 'Demo only: start again from the fresh draw.'), el('button', { class: 'btn danger', onclick: async () => { demoServer.reset(); await load(); toast('Demo reset.'); } }, 'Reset demo')) : null);
}

/* ---------------- Start ---------------- */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; store.set('tab', S.tab); render(); });
document.getElementById('reload').onclick = () => load().then(ok => ok && toast('Up to date.'));
document.getElementById('theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; store.set('theme', next);
};
if (store.get('theme')) document.documentElement.dataset.theme = store.get('theme');
S.tab = store.get('tab') || 'score';
(async () => {
  if (typeof demoServer !== 'undefined') document.getElementById('demo').classList.remove('hidden');
  store.set('code', '');
  if (await load()) { document.getElementById('app').classList.remove('hidden'); }
  else { document.getElementById('loginErr').textContent = S.err || 'Could not open the sheet.'; document.getElementById('login').classList.remove('hidden'); }
  // Pick up scores typed straight into the sheet.
  setInterval(() => { if (!S.busy && !queue.size && S.data && !document.hidden && document.getElementById('view').dataset.dirty !== '1') load(); }, 20000);
})();
</script>
</body>
</html>
