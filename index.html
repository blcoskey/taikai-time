<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Shiai Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #f4f2ed; --card: #ffffff; --ink: #1b1f2a; --muted: #686d78; --line: #e2dfd8; --soft: #efece6;
    --accent: #24345e; --accent-ink: #ffffff; --red: #c8102e; --red-bg: #fbe5e8; --white-edge: #b9bfcc; --white-bg: #eef0f4;
    --good: #2f7d4f; --good-bg: #e2f1e8; --warn: #a35a00; --warn-bg: #fdf0d8; --now: #f2b705; --done-bg: #e4e1d9; --shadow: 0 1px 3px rgba(20,24,35,.08); color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a; --card: #1c1f27; --ink: #eef0f5; --muted: #9aa0ad; --line: #2e323d; --soft: #252933;
      --accent: #8fa6e8; --accent-ink: #10131a; --red: #ff5a6e; --red-bg: #3a1c22; --white-edge: #d9dde6; --white-bg: #2a2e38;
      --good: #6fd19a; --good-bg: #1a3326; --warn: #f4b860; --warn-bg: #3a2a12; --now: #f2c84b; --done-bg: #16181e; --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a; --card: #1c1f27; --ink: #eef0f5; --muted: #9aa0ad; --line: #2e323d; --soft: #252933;
    --accent: #8fa6e8; --accent-ink: #10131a; --red: #ff5a6e; --red-bg: #3a1c22; --white-edge: #d9dde6; --white-bg: #2a2e38;
    --good: #6fd19a; --good-bg: #1a3326; --warn: #f4b860; --warn-bg: #3a2a12; --now: #f2c84b; --done-bg: #16181e; --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: env(safe-area-inset-bottom); }
  .wrap { max-width: 640px; margin: 0 auto; padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 12px 0 8px; }
  .toprow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  h1 { font-size: 21px; margin: 0; letter-spacing: -.01em; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #sync { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .roundbtn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 19px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
  #refresh.spin span { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .comps { display: flex; gap: 6px; overflow-x: auto; margin: -2px 0 10px; padding-bottom: 2px; scrollbar-width: none; }
  .comps button { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .comps button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .comps button .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--now); margin-left: 6px; vertical-align: 1px; }
  .tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 650; padding: 9px 4px; border-radius: 9px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
  .search { display: flex; gap: 8px; margin-top: 8px; }
  .search input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
  .search button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 600; cursor: pointer; }
  .demo { background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 10px; margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .demo span { flex: 1; min-width: 160px; }
  .demo button { border: 0; background: var(--warn); color: var(--card); font: inherit; font-weight: 700; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .demo button.ghost { background: transparent; color: var(--warn); text-decoration: underline; padding: 6px 4px; }

  h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 2px 8px; font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 10px; box-shadow: var(--shadow); }
  .empty { color: var(--muted); }

  /* Fight cards */
  .fight .fhead { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .fight .fhead .no { font-weight: 800; color: var(--ink); }
  .fight .fhead .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; white-space: nowrap; letter-spacing: .02em; text-transform: uppercase; }
  .pill.now { background: var(--now); color: #1b1f2a; }
  .pill.next { background: var(--soft); color: var(--ink); }
  .pill.done { background: var(--good-bg); color: var(--good); }
  .pill.wait { background: var(--soft); color: var(--muted); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .side { display: flex; align-items: center; gap: 10px; padding: 6px 0 6px 10px; border-left: 5px solid; }
  .side + .side { margin-top: 4px; }
  .side.red { border-color: var(--red); }
  .side.white { border-color: var(--white-edge); }
  .side .who { flex: 1; min-width: 0; }
  .side .nm { font-weight: 700; overflow-wrap: anywhere; cursor: pointer; }
  .side .nm.pending { font-weight: 500; font-style: italic; color: var(--muted); cursor: default; }
  .side .dj { font-size: 12px; color: var(--muted); }
  .side.win .nm::after { content: " ✓"; color: var(--good); }
  .side.lose { opacity: .55; }
  .marks { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .mk { min-width: 26px; height: 26px; padding: 0 5px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
  .red .mk { background: var(--red-bg); color: var(--red); }
  .white .mk { background: var(--white-bg); color: var(--ink); }
  .mk.hs { background: var(--warn-bg) !important; color: var(--warn) !important; }
  .score { width: 30px; text-align: right; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .fnote { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .fnote.warn { color: var(--warn); font-weight: 600; }
  .fight.isnow { border: 2px solid var(--now); }
  .fight { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--hdr, 200px) + 64px); }
  .fight.isdone { background: var(--done-bg); box-shadow: none; }
  .fight.isdone .nm { color: var(--muted); }
  .fight.isdone .side.win .nm { color: var(--ink); }
  .stage { position: relative; }
  .stagehead { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr, 200px)); z-index: 4; background: var(--bg); margin: 0 -2px; padding: 14px 4px 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); }
  .stagehead b { font-size: 15px; letter-spacing: .02em; }
  .stagehead span { font-size: 12px; color: var(--muted); }
  #jump { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); border: 0; border-radius: 999px; padding: 12px 20px; background: var(--now); color: #1b1f2a; font: inherit; font-weight: 800; box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; white-space: nowrap; }
  #jump:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { padding-bottom: 90px !important; }
  .fight.big .side { padding-top: 10px; padding-bottom: 10px; }
  .fight.big .nm { font-size: 19px; }
  .fight.big .score { font-size: 30px; width: 40px; }
  .fight.big .mk { min-width: 32px; height: 32px; font-size: 16px; }
  .fight.mine { outline: 2px solid var(--accent); outline-offset: -1px; }
  .bouts { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 6px; display: grid; gap: 3px; }
  .bout { display: grid; grid-template-columns: minmax(0, 1fr) auto 54px auto minmax(0, 1fr); align-items: center; gap: 6px; font-size: 13px; }
  .bout .bn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .bout .bn.r { text-align: left; border-left: 3px solid var(--red); padding-left: 6px; }
  .bout .bn.w { text-align: right; border-right: 3px solid var(--white-edge); padding-right: 6px; }
  .bout .bn.won { font-weight: 800; }
  .bout .bn.empty { color: var(--muted); font-style: italic; }
  .bout .bm { display: flex; gap: 2px; }
  .bout .bm .mk { min-width: 20px; height: 20px; font-size: 12px; padding: 0 3px; border-radius: 5px; }
  .bout .bm.r .mk { background: var(--red-bg); color: var(--red); }
  .bout .bm.w .mk { background: var(--white-bg); color: var(--ink); }
  .bout .bc { text-align: center; line-height: 1.1; }
  .bout .bc small { display: block; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .bout .bc b { font-variant-numeric: tabular-nums; }
  .bout.pending .bc b { color: var(--muted); font-weight: 500; }
  .tscore { font-size: 11px; color: var(--muted); text-align: right; font-weight: 600; }
  .shin { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .shin b { font-weight: 700; color: var(--ink); }
  .chipbtn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; }
  .chipbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* Fighter focus */
  .focus h3 { margin: 0; font-size: 19px; overflow-wrap: anywhere; }
  .focus .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .focus .big { font-weight: 700; margin-top: 8px; }

  /* Pools */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: right; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; padding: 4px 3px; }
  td { text-align: right; padding: 7px 3px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th.l, td.l { text-align: left; }
  td.pl { width: 24px; font-weight: 800; text-align: left; }
  td .nm { font-weight: 700; cursor: pointer; overflow-wrap: anywhere; }
  td .dj { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  td.pts { font-weight: 800; font-size: 15px; }
  tr.q td.pl { color: var(--good); }
  .through { font-size: 10px; font-weight: 800; color: var(--good); background: var(--good-bg); border-radius: 999px; padding: 1px 6px; margin-left: 4px; vertical-align: 1px; white-space: nowrap; }
  .tiechip { font-size: 10px; font-weight: 800; color: var(--warn); background: var(--warn-bg); border-radius: 999px; padding: 1px 6px; margin-left: 4px; vertical-align: 1px; }
  .phead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .phead b { font-size: 18px; }
  .phead span { font-size: 13px; color: var(--muted); }
  .banner { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-weight: 600; font-size: 14px; background: var(--warn-bg); color: var(--warn); }
  .legend { color: var(--muted); font-size: 13px; margin: 14px 2px 0; }

  /* Results */
  .podium { display: grid; gap: 8px; }
  .pod { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--soft); }
  .pod .medal { font-size: 24px; width: 30px; text-align: center; }
  .pod .nm { font-weight: 800; font-size: 17px; overflow-wrap: anywhere; }
  .pod .dj { font-size: 12px; color: var(--muted); }
  .pod.gold { background: linear-gradient(90deg, rgba(242,183,5,.28), var(--soft)); }


  /* Ladder */
  .ladderwrap { overflow-x: auto; margin: 0 -16px; padding: 4px 16px 12px; -webkit-overflow-scrolling: touch; }
  .lrounds { display: none; }
  .lnode { display: flex; align-items: center; width: max-content; }
  .lkids { display: flex; flex-direction: column; margin-right: 28px; }
  .lkid { position: relative; padding: 6px 0; }
  .lkid::after { content: ""; position: absolute; right: -14px; top: 50%; width: 14px; border-top: 2px solid var(--white-edge); }
  .lkid::before { content: ""; position: absolute; right: -14px; border-right: 2px solid var(--white-edge); }
  .lkid:first-child::before { top: 50%; bottom: 0; }
  .lkid:last-child::before { top: 0; bottom: 50%; }
  .lkid.only::before { display: none; }
  .lself.fed { position: relative; }
  .lself.fed::before { content: ""; position: absolute; left: -14px; top: 50%; width: 14px; border-top: 2px solid var(--white-edge); }
  .lmatch { width: 178px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px 7px; box-shadow: var(--shadow); }
  .lmatch.isdone { background: var(--done-bg); box-shadow: none; }
  .lmatch.isnow { border: 2px solid var(--now); }
  .lcap { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .03em; margin-bottom: 3px; }
  .lrow { display: flex; align-items: center; gap: 6px; padding: 3px 0 3px 7px; border-left: 4px solid; font-size: 14px; }
  .lrow + .lrow { margin-top: 3px; }
  .lrow.red { border-color: var(--red); }
  .lrow.white { border-color: var(--white-edge); }
  .lnm { flex: 1; min-width: 0; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .lnm.pending { font-weight: 400; font-style: italic; color: var(--muted); cursor: default; }
  .lrow.win .lnm { font-weight: 800; }
  .lrow.win .lnm::after { content: " ✓"; color: var(--good); }
  .lrow.lose { opacity: .55; }
  .lrow.hit { background: var(--soft); border-radius: 0 6px 6px 0; }
  .lsc { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 12px; text-align: right; }
  .foot { margin-top: 26px; color: var(--muted); font-size: 12px; text-align: center; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="toprow">
      <h1 id="title">Shiai</h1>
      <span id="sync"></span>
      <button id="theme" class="roundbtn" type="button" aria-label="Switch light or dark">◐</button>
      <button id="refresh" class="roundbtn" type="button" aria-label="Refresh"><span>↻</span></button>
    </div>
    <nav id="comps" class="comps hidden" aria-label="Competition"></nav>
    <nav class="tabs" role="tablist">
      <button id="tab-fights" role="tab" aria-selected="true">Fights</button>
      <button id="tab-pools" role="tab" aria-selected="false">Pools</button>
      <button id="tab-ko" role="tab" aria-selected="false">Ladder</button>
    </nav>
    <div class="search">
      <input id="q" type="search" placeholder="Find a fighter or dojo" autocomplete="off" aria-label="Find a fighter or dojo">
      <button id="clear" type="button" class="hidden">Clear</button>
    </div>
  </header>
  <main id="view"></main>
  <button id="jump" type="button" class="hidden">Go to current fight</button>
  <div class="foot" id="foot"></div>
</div>

<script src="config.js?v=1795798801"></script>
<script>
'use strict';
/* =====================================================================
   SETTINGS
   SHEET: the Google Sheet's link (or just its ID), set in config.js. The sheet must be shared as
   "Anyone with the link: Viewer". The board reads the Board tab, which the sheet keeps up to date.
   With no sheet set, the page runs a demo with made-up fighters (unless SHIAI_LIVE is set).
   ===================================================================== */
const SHEET = (typeof window !== 'undefined' && (window.SHIAI_SHEET || window.SHIAI_SHEET_ID)) || '';
const SHEET_ID = (String(SHEET).match(/\/d\/([a-zA-Z0-9_-]+)/) || [])[1] || String(SHEET).trim();
const POLL_MS = 15000;

/* ===================== SHIAI CORE (shared by Code.gs and the web page) =====================
   Pure functions only: no sheet or page access here, so the sheet and the web app always agree.
   Kendo scoring: M (men), K (kote), D (do), T (tsuki) and H (point from opponent's hansoku) are ippon.
   ∆ marks one hansoku against that fighter (shown, but scores nothing).
============================================================================================== */

var SHIAI_IPPON = ['M', 'K', 'D', 'T', 'H'];
var SHIAI_DECISIONS = ['Red wins by forfeit', 'White wins by forfeit', 'Both forfeit', 'Red wins by hantei', 'White wins by hantei'];
var SHIAI_DEFAULTS = { title: 'Shiai', type: 'individual', teamSize: 3, courts: 1, poolSize: 3, qualify: 2, winPts: 3, drawPts: 2, ipponPts: 1, showSpirit: false, hantei: false, enchoMin: 0, forfeitIppon: 2 };

function shiaiKey(s) { return String(s == null ? '' : s).trim().replace(/\s+/g, ' ').toLowerCase(); }
function shiaiClean(s) { return String(s == null ? '' : s).trim().replace(/\s+/g, ' '); }

function shiaiMark(v) {
  var s = String(v == null ? '' : v).trim().toUpperCase();
  if (!s) return '';
  if (s === '∆' || s === 'Δ' || s === '▲' || s === '△' || s === '^' || s === 'X') return '∆';
  return s.charAt(0);
}

// Pool round robin order. Red is listed first. Small pools use the usual fixed orders.
function shiaiRoundRobin(n) {
  if (n < 2) return [];
  if (n === 2) return [[1, 2]];
  if (n === 3) return [[1, 2], [2, 3], [3, 1]];
  if (n === 4) return [[1, 2], [3, 4], [1, 3], [2, 4], [1, 4], [2, 3]];
  var ids = []; for (var i = 1; i <= n; i++) ids.push(i);
  if (n % 2) ids.push(0);
  var m = ids.length, out = [];
  for (var r = 0; r < m - 1; r++) {
    for (var j = 0; j < m / 2; j++) {
      var a = ids[j], b = ids[m - 1 - j];
      if (a && b) out.push(r % 2 ? [b, a] : [a, b]);
    }
    ids.splice(1, 0, ids.pop());
  }
  return out;
}

function shiaiPoolLetters(n) {
  var out = [];
  for (var i = 0; i < n; i++) out.push(i < 26 ? String.fromCharCode(65 + i) : 'P' + (i + 1));
  return out;
}

// Put fighters without a pool into pools, keeping club mates apart where possible.
// Returns a new list; fighters that already have a pool keep it.
function shiaiAssignPools(fighters, poolSize) {
  var list = fighters.map(function (f) { return { name: f.name, dojo: f.dojo, grade: f.grade, pool: shiaiClean(f.pool).toUpperCase() }; });
  var open = list.filter(function (f) { return !f.pool; });
  if (!open.length) return list;
  var size = Math.max(2, Number(poolSize) || 3);
  var existing = {};
  list.forEach(function (f) { if (f.pool) existing[f.pool] = (existing[f.pool] || 0) + 1; });
  var nPools = Math.max(1, Math.ceil(open.length / size));
  var letters = shiaiPoolLetters(nPools + Object.keys(existing).length).filter(function (l) { return !existing[l]; }).slice(0, nPools);
  // Biggest clubs first, then deal round the pools in a snake so each club spreads out.
  var byDojo = {};
  open.forEach(function (f) { var k = shiaiKey(f.dojo) || '~' + f.name; (byDojo[k] = byDojo[k] || []).push(f); });
  var groups = Object.keys(byDojo).map(function (k) { return byDojo[k]; }).sort(function (a, b) { return b.length - a.length; });
  var order = [].concat.apply([], groups);
  var counts = letters.map(function () { return 0; });
  var cap = letters.map(function (_, i) { return Math.floor(open.length / nPools) + (i < open.length % nPools ? 1 : 0); });
  var clubIn = letters.map(function () { return {}; });
  order.forEach(function (f) {
    var k = shiaiKey(f.dojo);
    var best = -1;
    for (var i = 0; i < letters.length; i++) {
      if (counts[i] >= cap[i]) continue;
      if (best < 0) { best = i; continue; }
      var ci = k ? (clubIn[i][k] || 0) : 0, cb = k ? (clubIn[best][k] || 0) : 0;
      if (ci < cb || (ci === cb && counts[i] < counts[best])) best = i;
    }
    f.pool = letters[best]; counts[best]++;
    if (k) clubIn[best][k] = (clubIn[best][k] || 0) + 1;
  });
  return list;
}

  // Now / next per court: the first fights not yet done.

  var final = byCode.FINAL;
  var results = null;
  var winnerOf = function (f) { return f.result === 'red' ? f.redName : f.result === 'white' ? f.whiteName : ''; };

    fighters: fighters.map(function (f) { return { name: f.name, dojo: f.dojo, pool: f.pool, members: f.members }; }),
    fights: fights.map(function (f) {

        red: { name: f.redName, label: f.redLabel, pending: f.redPending, from: f.redFrom, dojo: dojoOf(f.redName), members: membersOf(f.redName), marks: f.rm, ippon: f.rIpp },
        white: { name: f.whiteName, label: f.whiteLabel, pending: f.whitePending, from: f.whiteFrom, dojo: dojoOf(f.whiteName), members: membersOf(f.whiteName), marks: f.wm, ippon: f.wIpp },
        decision: f.decision, done: f.done, result: f.result, status: f.status || (f.done ? 'done' : 'later'), row: f.row, hantei: !!f.hantei, forfeit: !!f.forfeit,
        scores: f.team ? { red: f.rScore, white: f.wScore } : null,

          return { pos: b.pos, extra: b.extra, done: b.done, result: b.res, decision: b.decision, row: b.row, level: !!b.level, hantei: !!b.hantei, forfeit: !!b.forfeit,
            red: { name: b.redTyped || (b.extra ? '' : rmem[k] || ''), marks: b.rm, ippon: b.rIpp }, white: { name: b.whiteTyped || (b.extra ? '' : wmem[k] || ''), marks: b.wm, ippon: b.wIpp } };
        }).filter(function (b) { return !b.extra || b.done || b.red.marks.length || b.white.marks.length || b.red.name || b.white.name; }) : null,

// Time estimate formulas for the Competitions tab. tab = fights tab name, L = the competition's column
// letter, R = row numbers of the settings. Counts the fights on the tab: fights (team bouts) before the
// semi-finals take the first time, the semi-finals and final the second. Courts run side by side.
function shiaiTimingFormulas(tab, team, L, R) {
  var q = "'" + tab.replace(/'/g, "''") + "'!";
  var B = q + '$B$2:$B$2000', E = q + '$E$2:$E$2000';
  var notBout = team ? ',' + E + ',"<>Team",' + E + ',"<>' + SHIAI_PLAYOFF_BOUT + '"' : '';
  var count = function (crit) { return 'COUNTIFS(' + B + ',' + crit + notBout + ')'; };
  var late = count('"SF*"') + '+' + count('"FINAL"');
  var courts = 'MAX(1,N(' + L + R.courts + '))';
  return {
    early: '=' + count('"<>"') + '-(' + late + ')',
    late: '=' + late,
    time: '=(ROUNDUP(' + L + R.nEarly + '/' + courts + ',0)*' + L + R.early + '+ROUNDUP(' + L + R.nLate + '/' + courts + ',0)*' + L + R.late + ')/1440',
    finish: '=IF(' + L + R.start + '="","",' + L + R.start + '+' + L + R.time + ')',
  };
}

// Shinpan rotation: three referee a match (shushin first, then two fukushin). Every two matches the
// longest-serving one steps out and the next on the list steps in, so the list cycles in order.
// block = which pair of matches this is, counted through the whole day.
var SHIAI_MATCHES_PER_ROTATION = 2;
function shiaiShinpanFor(names, block) {
  var n = names.length, out = ['', '', ''];
  for (var k = 0; k < Math.min(3, n); k++) out[k] = names[(block + k) % n];
  return out;
}

// The pool table that sits beside the fights on the admin sheet: one block per pool, with
// what's left to fight and whether a play-off is needed. Returns rows of 9 cells and a style per row.
var SHIAI_PANEL_HEAD = ['Place', 'Fighter', 'Fought', 'Won', 'Drawn', 'Lost', 'Ippon', 'Points', 'Status'];
function shiaiPoolPanel(state) {
  var rows = [], styles = [];
  var team = state.type === 'team';
  var push = function (r, s) { while (r.length < 9) r.push(''); rows.push(r); styles.push(s); };
  var ordinal = function (n) { return n === 1 ? '1st' : n === 2 ? '2nd' : n === 3 ? '3rd' : n + 'th'; };
  if (!state.pools.length) { push(['No pools yet. Generate the draw first.'], 'note'); return { rows: rows, styles: styles }; }
  state.pools.forEach(function (p) {
    var left = p.total - p.played;
    var status = !p.total ? 'no fights' : p.playoffNeeded ? 'PLAY-OFF NEEDED' : p.complete ? 'finished' : p.played + ' of ' + p.total + (p.total === 1 ? ' fight' : ' fights') + ' done, ' + left + ' to go';
    push(['Pool ' + p.pool, status], p.playoffNeeded ? 'alert-title' : p.complete ? 'done-title' : 'title');
    var head = SHIAI_PANEL_HEAD.slice(); if (team) head[1] = 'Team';
    push(head, 'head');
    p.rows.forEach(function (r) {
      var st = r.tied ? 'Tied: play-off' : r.qualified ? 'Through' : p.complete ? 'Out' : '';
      push([p.played ? r.place : '', r.name, r.fought, r.w, r.d, r.l, r.ipp, r.points, st], r.tied ? 'tied' : r.qualified ? 'through' : 'row');
    });
    if (p.playoffNeeded) {
      var places = {};
      p.rows.filter(function (r) { return r.tied; }).forEach(function (r) { (places[r.place] = places[r.place] || []).push(r.name); });
      Object.keys(places).forEach(function (pl) {
        var nm = places[pl]; push([nm.slice(0, -1).join(', ') + ' and ' + nm[nm.length - 1] + ' are level for ' + ordinal(Number(pl)) + '. Use Shiai > Add play-off fights.'], 'alert');
      });
    } else if (p.complete) {
      var through = p.rows.filter(function (r) { return r.qualified; }).map(function (r) { return ordinal(r.place) + ' ' + r.name; });
      if (through.length) push(['Through: ' + through.join(', ')], 'note');
    }
    push([], 'gap');
  });
  return { rows: rows, styles: styles };
}


/* ---------------- Data sources ---------------- */
function appsScriptSource() {
  return () => new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(s => { try { resolve(JSON.parse(s)); } catch (e) { reject(new Error('The sheet sent something unexpected.')); } })
      .withFailureHandler(() => reject(new Error('No connection. Check your signal.')))
      .api();
  });
}
// Reads the Board tab through Google's public sheet query feed (no sign-in, works from any site).
function sheetSource(id) {
  let n = 0;
  return async () => {
    const url = 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(id) + '/gviz/tq?sheet=Board&headers=0&tqx=out:json;reqId:' + (++n) + '-' + Date.now();
    let res;
    try { res = await fetch(url, { cache: 'no-store' }); }
    catch (e) { throw new Error('No connection, or the sheet is not shared as "Anyone with the link".'); }
    const text = await res.text();
    const a = text.indexOf('('), b = text.lastIndexOf(')');
    let q; try { q = JSON.parse(text.slice(a + 1, b)); } catch (e) { throw new Error('Could not read the sheet. Is it shared as "Anyone with the link: Viewer"?'); }
    if (q.status === 'error') throw new Error('Could not read the sheet: ' + ((q.errors && q.errors[0] && (q.errors[0].detailed_message || q.errors[0].message)) || 'unknown error') + '.');
    const json = ((q.table && q.table.rows) || []).map(r => (r.c && r.c[0] && r.c[0].v) || '').filter(v => typeof v === 'string' && v[0] === '~').map(v => v.slice(1)).join('');
    if (!json) throw new Error('The Board tab is empty. In the sheet, use Shiai > Update public board.');
    let d; try { d = JSON.parse(json); } catch (e) { throw new Error('The Board tab is mid-update. Trying again shortly.'); }
    if (!d || d.ok !== true) throw new Error('Could not read the sheet.');
    return d;
  };
}

const IN_APPS_SCRIPT = typeof google !== 'undefined' && !!(google.script && google.script.run);
// The live site sets SHIAI_LIVE: it only ever shows the sheet, never the demo.
const LIVE_ONLY = typeof window !== 'undefined' && window.SHIAI_LIVE === true;
const DEMO = false;
const fetchState = IN_APPS_SCRIPT ? appsScriptSource() : SHEET_ID ? sheetSource(SHEET_ID) : () => Promise.reject(new Error('The board is not connected to the sheet yet. Add the sheet link to config.js.'));

/* ---------------- Helpers ---------------- */
function lsGet(k) { try { return localStorage.getItem('shiai_' + k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { v ? localStorage.setItem('shiai_' + k, v) : localStorage.removeItem('shiai_' + k); } catch (e) {} }
function el(tag, attrs, ...kids) {

    else n.setAttribute(k, v === true && !k.startsWith('aria-') ? '' : String(v));

  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = el('div', { class: 'toast', role: 'status' }, msg);
  document.body.append(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2800);
}
const norm = s => String(s || '').trim().toLowerCase();

/* ---------------- State ---------------- */
const S = { tab: lsGet('tab') || 'fights', all: null, data: null, comp: lsGet('comp'), q: '', lastSync: 0 };

let refreshing = false;
async function refresh(quiet) {
  if (refreshing) return;
  refreshing = true;
  const btn = document.getElementById('refresh');
  if (!quiet) btn.classList.add('spin');
  try {
    const first = !S.data;
    const st = await fetchState();
    S.all = st.competitions ? st : { event: st.title, competitions: [Object.assign({ name: st.title }, st)] };
    pickComp();
    S.lastSync = Date.now();
    render();
    if (first) scrollToNow();
  } catch (e) {
    if (!quiet) toast(e.message);
    if (!S.data) view.replaceChildren(el('div', { class: 'card empty' }, e.message));
    document.getElementById('sync').textContent = 'offline';
  } finally { refreshing = false; btn.classList.remove('spin'); }
}

function pickComp() {

}

    c.name, c.fights.some(f => f.status === 'now') && !c.fights.every(f => f.done) && c.fights.some(f => f.done || f.status === 'now' && (f.red.marks.length || f.white.marks.length || (f.bouts || []).some(b => b.done))) ? el('span', { class: 'live', title: 'In progress' }) : null)));
}

/* ---------------- Render ---------------- */
const view = document.getElementById('view');
function render() {
  for (const t of ['fights', 'pools', 'ko']) document.getElementById('tab-' + t).setAttribute('aria-selected', S.tab === t);
  document.getElementById('clear').classList.toggle('hidden', !S.q);
  const d = S.data;
  if (!d) { view.replaceChildren(el('div', { class: 'card empty' }, 'Loading…')); return; }
  renderComps();
  const title = S.all.event || d.title;
  document.getElementById('title').textContent = title;
  document.title = title;
  document.getElementById('tab-ko').classList.toggle('hidden', !d.fights.some(f => f.ko));
  if (S.tab === 'ko' && !d.fights.some(f => f.ko)) S.tab = 'fights';
  updateJump();
  const content = S.tab === 'pools' ? renderPools() : S.tab === 'ko' ? renderLadder() : renderFights();
  view.replaceChildren(content);
  document.getElementById('sync').textContent = S.lastSync ? new Date(S.lastSync).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  const done = d.fights.filter(f => f.done).length;
  document.getElementById('foot').textContent = d.name + ': ' + done + ' of ' + d.fights.length + (d.type === 'team' ? ' matches' : ' fights') + ' done · updates every ' + Math.round(POLL_MS / 1000) + ' seconds';
}

function matches(f) {

  return [f.red, f.white].some(s => norm(s.name).includes(q) || norm(s.dojo).includes(q)) || (f.bouts || []).some(b => norm(b.red.name).includes(q) || norm(b.white.name).includes(q));
}

const courtLabel = f => S.data.courts > 1 ? 'Court ' + f.court : '';

}

    el('div', { class: 'who' },

const MARK_NAMES = { M: 'Men', K: 'Kote', D: 'Do', T: 'Tsuki', H: 'Hansoku point', '∆': 'Hansoku' };
function fightCard(f, big) {

function focusCard() {
  const d = S.data, q = norm(S.q);
  const people = d.fighters.filter(f => norm(f.name).includes(q) || (f.members || []).some(m => norm(m).includes(q)));
  if (people.length !== 1) return null;
  const p = people[0];
  const pool = d.pools.find(x => x.rows.some(r => norm(r.name) === norm(p.name)));
  const row = pool && pool.rows.find(r => norm(r.name) === norm(p.name));
  const theirs = d.fights.filter(f => norm(f.red.name) === norm(p.name) || norm(f.white.name) === norm(p.name));
  const upcoming = theirs.find(f => !f.done);
  let line = 'No more fights scheduled.';
  if (upcoming) {
    const ahead = d.fights.filter(f => !f.done && f.court === upcoming.court && f.order < upcoming.order).length;
    line = upcoming.status === 'now' ? 'Fighting now' + (d.courts > 1 ? ' on court ' + upcoming.court : '') + '.'

}

// Fights grouped under a heading that sticks below the top bar while you scroll that group.
function stageSections(fights, nameOf) {
  const groups = [];
  fights.forEach(f => { const n = nameOf(f); const g = groups[groups.length - 1]; if (g && g.name === n) g.list.push(f); else groups.push({ name: n, list: [f] }); });
  return el('div', {}, groups.map(g => {
    const done = g.list.filter(f => f.done).length;
    return el('section', { class: 'stage' },
      el('div', { class: 'stagehead' }, el('b', {}, g.name), el('span', {}, done === g.list.length ? 'All ' + g.list.length + ' done' : done + ' of ' + g.list.length + ' done')),
      g.list.map(f => fightCard(f, false)));
  }));
}

function renderPools() {
  const d = S.data;
  if (!d.pools.length) return el('div', { class: 'card empty' }, 'No pools yet.');
  const q = norm(S.q);
  const pools = q ? d.pools.filter(p => p.rows.some(r => norm(r.name).includes(q) || norm(r.dojo).includes(q))) : d.pools;
  const out = pools.map(p => el('div', { class: 'card' },
    el('div', { class: 'phead' }, el('b', {}, 'Pool ' + p.pool), el('span', {}, p.complete ? 'Finished' : p.played + ' of ' + p.total + ' fights')),
    el('table', {},
      el('thead', {}, el('tr', {}, el('th', { class: 'l' }, ''), el('th', { class: 'l' }, 'Fighter'), el('th', { title: 'Won' }, 'W'), el('th', { title: 'Drawn' }, 'D'), el('th', { title: 'Lost' }, 'L'), el('th', { title: 'Ippon scored' }, 'Ipp'), el('th', { title: 'Points' }, 'Pts'))),
      el('tbody', {}, p.rows.map(r => el('tr', { class: r.qualified ? 'q' : '' },
        el('td', { class: 'pl' }, (p.complete || r.fought) ? r.place : '–'),
        el('td', { class: 'l' }, el('span', { class: 'nm', onclick: () => setQuery(r.name) }, r.name), r.qualified ? el('span', { class: 'through' }, 'Through') : null, r.tied ? el('span', { class: 'tiechip' }, 'Tied') : null, (r.members && r.members.length) ? el('span', { class: 'dj' }, r.members.join(', ')) : r.dojo ? el('span', { class: 'dj' }, r.dojo) : null),
        el('td', {}, r.w), el('td', {}, r.d), el('td', {}, r.l), el('td', {}, r.ipp), el('td', { class: 'pts' }, r.points))))),
    p.playoffNeeded ? el('div', { class: 'banner' }, 'Play-off needed: ' + p.tiedNames.join(' and ') + ' are tied.') : null));
  if (!out.length) out.push(el('div', { class: 'card empty' }, 'No pools match "' + S.q + '".'));
  const st = d.settings;
  out.push(el('p', { class: 'legend' }, 'Points: ' + st.winPts + ' for a ' + (d.type === 'team' ? 'match won' : 'win') + ', ' + st.drawPts + ' for a draw, ' + st.ipponPts + ' per ippon scored. ' + (st.qualify ? 'Top ' + st.qualify + ' in each pool go through.' : '')));
  return el('div', {}, out);
}

function resultsCard() {
  const d = S.data, r = d.results;
  if (!r) return null;
  const dojo = n => { const f = d.fighters.find(x => norm(x.name) === norm(n)); return f ? f.dojo : ''; };
  const pod = (medal, n, cls) => el('div', { class: 'pod ' + (cls || '') }, el('span', { class: 'medal' }, medal), el('div', {}, el('div', { class: 'nm' }, n), dojo(n) ? el('div', { class: 'dj' }, dojo(n)) : null));
  return el('div', { class: 'card' },
    el('div', { class: 'podium' },
      pod('🥇', r.first, 'gold'), pod('🥈', r.second), r.thirds.map(t => pod('🥉', t)),
      d.spirit && d.spirit.length ? pod('🔥', d.spirit[0].name + ' · Fighting spirit') : null));
}

// Ladder: the knockout drawn as a bracket, built from the final back through each fight's sources.
function ladderMatch(f) {
  const line = side => {
    const sd = f[side];
    const won = f.done && f.result === side, lost = f.done && (f.result === 'red' || f.result === 'white') && f.result !== side;
    const hit = sideMatches(sd);
    return el('div', { class: 'lrow ' + side + (won ? ' win' : '') + (lost ? ' lose' : '') + (hit ? ' hit' : '') },
      el('span', { class: 'lnm' + (sd.pending ? ' pending' : ''), onclick: sd.pending ? null : () => setQuery(sd.name) }, sd.label),
      el('span', { class: 'lsc' }, f.team ? (teamStarted(f) ? f.wins[side] : '') : (f.done || sd.marks.length) ? sd.ippon : ''));
  };
  return el('div', { class: 'lmatch' + (f.status === 'now' ? ' isnow' : '') + (f.done ? ' isdone' : '') },
    el('div', { class: 'lcap' }, f.code + ' · #' + f.order + (f.status === 'now' ? ' · NOW' : '') + (f.decision ? ' · ' + (/hantei/.test(f.decision) ? 'hantei' : 'forfeit') : '')),
    line('red'), line('white'));
}
function ladderNode(f, byCode) {
  const kids = ['red', 'white'].map(s => /^W:/i.test(f[s].from || '') ? byCode[f[s].from.slice(2).toUpperCase()] : null).filter(Boolean);
  return el('div', { class: 'lnode' },
    kids.length ? el('div', { class: 'lkids' }, kids.map(k => el('div', { class: 'lkid' + (kids.length === 1 ? ' only' : '') }, ladderNode(k, byCode)))) : null,
    el('div', { class: 'lself' + (kids.length ? ' fed' : '') }, ladderMatch(f)));
}
function renderLadder() {
  const d = S.data;
  const out = [];
  const res = resultsCard();
  if (res) { out.push(el('h2', { class: 'sec' }, 'Results')); out.push(res); }
  const ko = d.fights.filter(f => f.ko);
  const byCode = {}; ko.forEach(f => { byCode[f.code] = f; });
  const fed = new Set(); ko.forEach(f => ['red', 'white'].forEach(s => { if (/^W:/i.test(f[s].from || '')) fed.add(f[s].from.slice(2).toUpperCase()); }));
  const roots = ko.filter(f => !fed.has(f.code));
  const rounds = [...new Set(ko.map(f => f.stage))];
  out.push(el('h2', { class: 'sec' }, 'Ladder'));
  out.push(el('div', { class: 'ladderwrap' },
    el('div', { class: 'lrounds' }, rounds.map(r => el('span', {}, r))),
    roots.map(f => ladderNode(f, byCode))));
  out.push(el('p', { class: 'legend' }, 'Scroll sideways to see the whole ladder. Tap a name to see that fighter\'s fights.'));
  return el('div', {}, out);
}

/* Always-visible button: scrolls the fight list to the fight on now (tap again for the next court). */
let jumpIdx = 0;
function updateJump() {
  const b = document.getElementById('jump');
  const nows = S.data ? S.data.fights.filter(f => f.status === 'now') : [];
  b.classList.toggle('hidden', !nows.length || S.tab === 'pools');
  b.textContent = nows.length > 1 ? 'Go to current fights' : 'Go to current fight';
}
document.getElementById('jump').onclick = () => {
  const nows = S.data.fights.filter(f => f.status === 'now');
  if (!nows.length) return;
  if (S.tab !== 'fights' || S.q) { S.tab = 'fights'; lsSet('tab', 'fights'); S.q = ''; document.getElementById('q').value = ''; render(); jumpIdx = 0; }
  const f = nows[jumpIdx % nows.length]; jumpIdx++;
  const card = document.getElementById('f-' + f.order);
  if (card) card.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
};
const headerEl = document.querySelector('header');
const setHdr = () => document.documentElement.style.setProperty('--hdr', headerEl.offsetHeight + 'px');
setHdr();
if (window.ResizeObserver) new ResizeObserver(setHdr).observe(headerEl); else addEventListener('resize', setHdr);

/* ---------------- Wiring ---------------- */
function setTab(t) { S.tab = t; lsSet('tab', t); render(); window.scrollTo(0, 0); }
document.getElementById('tab-fights').onclick = () => setTab('fights');
document.getElementById('tab-pools').onclick = () => setTab('pools');
document.getElementById('tab-ko').onclick = () => setTab('ko');
document.getElementById('refresh').onclick = () => refresh(false);
const qIn = document.getElementById('q');
qIn.value = S.q;
qIn.oninput = () => { S.q = qIn.value.trim(); render(); };
document.getElementById('clear').onclick = () => { S.q = ''; qIn.value = ''; render(); };
function applyTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
applyTheme(lsGet('theme'));
document.getElementById('theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark'; applyTheme(next); lsSet('theme', next);
};

render();
refresh(false);
setInterval(() => { if (!document.hidden) refresh(true); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });
</script>
</body>
</html>
